<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast-Paced FPS Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #000;
        }
        
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: none;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .ui-element {
            position: absolute;
            color: #fff;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        
        #healthBar {
            bottom: 30px;
            left: 30px;
            font-size: 18px;
        }
        
        #ammoCounter {
            bottom: 30px;
            right: 30px;
            font-size: 18px;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            opacity: 0.8;
        }
        
        #instructions {
            top: 30px;
            left: 30px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div id="crosshair"></div>
        
        <div id="healthBar" class="ui-element">
            Health: <span id="healthValue">100</span>
        </div>
        
        <div id="ammoCounter" class="ui-element">
            Rockets: <span id="ammoValue">8</span>
        </div>
        
        <div id="instructions" class="ui-element">
            WASD: Move | Mouse: Look | LMB: Shoot | Space: Jump/Fly | Shift: Dash | F: Toggle Flight
        </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
